name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Create .env file
        run: |
          cat > .env << EOF
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID=${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          EOF

      - name: Build web app
        env:
          CAPACITOR_BUILD: "1"
        run: bun run build

      - name: Prepare dist folder for Capacitor
        run: |
          if [ -f "dist/index.html" ]; then
            echo "dist already contains index.html"
          elif [ -d ".output/public" ]; then
            rm -rf dist
            cp -r .output/public dist
            echo "Copied .output/public to dist"
          else
            echo "Could not locate build output. Searching for index.html..."
            find . -maxdepth 4 -iname "index.html" -not -path "*/node_modules/*"
            exit 1
          fi

      - name: Sync Capacitor Android project
        run: bunx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
