name: بناء تطبيق أندرويد (APK)

# يبني ملف APK جاهزًا للتثبيت، دون الحاجة لأي جهاز كمبيوتر أو Android Studio.
# طريقة الاستخدام: ارفع المشروع إلى GitHub، أضف 3 أسرار (Secrets) في إعدادات
# المستودع، ثم شغّل هذا الـ workflow يدويًا وحمّل الملف الناتج من "Artifacts".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: سحب المشروع
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تثبيت Java (مطلوب لبناء أندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: تثبيت حزم المشروع
        run: npm ci

      - name: بناء ملفات الويب
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          CAPACITOR_BUILD: "1"

      - name: توليد index.html ثابت من الخادم (لتطبيق أندرويد فقط)
        run: |
          PORT=3000 node .output/server/index.mjs &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/ -o .output/public/index.html; then
              break
            fi
            sleep 0.5
          done
          kill $SERVER_PID
          test -s .output/public/index.html

      - name: ربط الإضافات الأصلية (Capacitor sync)
        run: npx cap sync android

      - name: صلاحية تنفيذ gradlew
        run: chmod +x android/gradlew

      - name: بناء APK (نسخة تجريبية debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: رفع ملف APK كمرفق للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
